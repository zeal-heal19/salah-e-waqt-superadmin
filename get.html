<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Salah-e-Waqt</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#141a33; --gold:#D4AF37; --gold-text:#F3D77A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { min-height: 100vh; background: linear-gradient(180deg,#1B2240,#0E1226); color: #fff; font-family: Poppins, system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
img { height: 110px; }
h1 { font-size: 26px; }
p { color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.5; }
.btn { width: 100%; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 600; font-size: 16px; text-decoration: none; }
.play { background: var(--gold); color: #141a33; }
.ios { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
.soon { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px dashed rgba(212,175,55,.6); background: rgba(212,175,55,.08);
  color: var(--gold-text); font-size: 14px; }
a:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Salah-e-Waqt">
  <h1>Salah-e-Waqt</h1>
  <p id="msg">Azan alerts and Jamat times from your masjid.</p>
  <a id="android" class="btn play" href="#">Get it on Google Play</a>
  <a id="ios" class="btn ios" href="#" hidden>Download on the App Store</a>
  <div id="soon" class="soon" hidden>The iPhone app is coming soon, in sha Allah.</div>
</main>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var L = window.APP_LINKS || {};
  var m = new URLSearchParams(location.search).get('m') || '';
  // Play Store passes `referrer` to the app after install, so the app can
  // later open this masjid straight away.
  var android = L.android + (m ? '&referrer=' + encodeURIComponent('utm_source=poster&masjid=' + m) : '');
  var ua = navigator.userAgent || '';
  var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  // Android tablets often load sites in "desktop mode", which hides
  // "Android" from the user agent (it says Linux). Also check Chrome's
  // platform hint, and treat a touch-screen Linux device as Android.
  var uaData = navigator.userAgentData;
  var isAndroid = /Android/i.test(ua) ||
    !!(uaData && /Android/i.test(uaData.platform || '')) ||
    (!isIos && /Linux/i.test(ua) && !/CrOS/i.test(ua) && navigator.maxTouchPoints > 1);

  document.getElementById('android').href = android;
  if (L.ios) {
    var ios = document.getElementById('ios');
    ios.href = L.ios;
    ios.hidden = false;
  }

  if (isAndroid) { location.replace(android); return; }
  if (isIos) {
    if (L.ios) { location.replace(L.ios); return; }
    document.getElementById('soon').hidden = false;
    document.getElementById('msg').textContent = 'Share this with your Android friends and family.';
  }
})();
</script>
</body>
</html>
